name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tester (inloggningsflöde m.m.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installera Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installera beroenden
        run: bun install --frozen-lockfile

      - name: Kör tester
        run: bun run test

      - name: Bygg (dev)
        run: bun run build:dev
